name: Ceviz Watch App Build (IPA)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      export_method:
        description: "Export method: app-store | development | ad-hoc"
        required: false
        default: "app-store"
        type: string
      candidate_for_device_check:
        description: "Internal device-check candidate only: preserve unresolved Watch URL evidence; do not distribute externally"
        required: false
        default: false
        type: boolean
      validation_only:
        description: "Run tests and native UI checks without signing or uploading"
        required: false
        default: false
        type: boolean
      baseline_revision:
        description: "Optional full previous SHA for reproducing the small-Watch visibility regression"
        required: false
        default: ""
        type: string

concurrency:
  group: ceviz-watch-build
  cancel-in-progress: false

jobs:
  build:
    name: Build CevizWatch IPA
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[distribution-only]') }}
    # Sabit imaj etiketi (macos-26) bir gun runner atanmadan iptal edilmeye
    # basladi; macos-latest her zaman desteklenen bir imaji gosterir.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run backend and contract tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run notification relay boundary tests
        run: node --test tests/js/push-relay.test.mjs

      - name: Validate installer and Doctor scripts
        run: |
          bash -n deploy/install.sh
          bash -n deploy/doctor.sh

      - name: Validate signing lane without credentials
        run: |
          ruby -c fastlane/Fastfile
          ruby tests/fastlane_signing_test.rb

      - name: Select Xcode
        run: |
          set -euo pipefail
          PINNED=/Applications/Xcode_26.4.1.app
          if [ -d "$PINNED" ]; then
            sudo xcode-select -s "$PINNED/Contents/Developer"
          else
            LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
            [ -n "$LATEST" ] || { echo "Xcode bulunamadi"; ls /Applications | head -30; exit 1; }
            echo "Sabitlenen Xcode yok, kullanilacak: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Run Swift job state regression tests
        run: |
          set -euo pipefail
          mkdir -p build/tests
          swiftc job-state/CVZJobState.swift ios-bridge/Models.swift tests/swift/JobStateTests.swift -o build/tests/job-state-tests
          build/tests/job-state-tests
          swiftc job-state/CVZJobState.swift apple-watch/Models.swift apple-watch/WatchResultTracking.swift tests/swift/WatchResultTests.swift -o build/tests/watch-result-tests
          build/tests/watch-result-tests
          swiftc apple-watch/WatchRecordingLifecycle.swift tests/swift/WatchRecordingTests.swift -o build/tests/watch-recording-tests
          build/tests/watch-recording-tests
          swiftc job-state/CVZJobState.swift ios-bridge/Models.swift watch-transport/WatchCommandTransport.swift tests/swift/WatchTransportTests.swift -o build/tests/phone-transport-tests
          build/tests/phone-transport-tests
          swiftc job-state/CVZJobState.swift apple-watch/Models.swift watch-transport/WatchCommandTransport.swift tests/swift/WatchTransportTests.swift -o build/tests/watch-transport-tests
          build/tests/watch-transport-tests

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Validate real Fastlane profile option configuration
        run: |
          ruby -c tests/fastlane_profile_options_test.rb
          ruby tests/fastlane_profile_options_test.rb

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild -list -project CevizWatch.xcodeproj

      - name: Validate simulator iPhone, Watch, and complication build
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project CevizWatch.xcodeproj \
            -scheme CevizBridge \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/validation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            build | tee build/validation-build.log
          WIDGET_PATH='build/validation/Build/Products/Release-iphonesimulator/CevizBridge.app/Watch/CevizWatchApp.app/PlugIns/CevizWatchWidget.appex'
          test -x "$WIDGET_PATH/CevizWatchWidget"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_PATH/Info.plist")" = 'com.apple.widgetkit-extension'

      - name: Capture real Watch launch before signing
        env:
          CEVIZ_DEVICE_CHECK_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_for_device_check }}
        run: |
          if [ "$CEVIZ_DEVICE_CHECK_CANDIDATE" = "true" ]; then
            python3 tests/watch_launch_smoke.py --candidate-for-device-check
          else
            python3 tests/watch_launch_smoke.py
          fi

      - name: Upload Watch launch proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceviz-watch-launch-smoke
          path: build/watch-launch-smoke/
          retention-days: 30
          if-no-files-found: warn

      - name: Reproduce previous small-Watch visibility failure
        if: ${{ inputs.baseline_revision != '' }}
        env:
          BASELINE_REVISION: ${{ inputs.baseline_revision }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_REVISION" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git fetch origin "$BASELINE_REVISION"
          git cat-file -e "${BASELINE_REVISION}^{commit}"
          mkdir -p build/previous
          git archive "$BASELINE_REVISION" | tar -x -C build/previous
          cp project.watch-ui.yml build/previous/
          cp -R tests/watch-ui build/previous/tests/
          python3 tests/watch_capture_ui.py --project build/previous --baseline

      - name: Validate actual Watch capture UI and larger text
        run: python3 tests/watch_capture_ui.py

      - name: Upload Watch capture UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceviz-watch-capture-ui
          path: |
            build/watch-capture-ui/**/context.json
            build/watch-capture-ui/**/*.log
            build/watch-capture-ui/**/*-attachments/**
          retention-days: 30
          if-no-files-found: warn

      - name: Import signing certificate
        if: ${{ !inputs.validation_only }}
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$P12_BASE64" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Write ASC API key
        if: ${{ !inputs.validation_only }}
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Build IPA + upload to TestFlight (Fastlane)
        if: ${{ !inputs.validation_only }}
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: fastlane ios beta

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceviz-watch-ipa
          path: build/ipa/*.ipa
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup keychain
        if: ${{ always() && !inputs.validation_only }}
        run: security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true

  distribute:
    name: Distribute existing TestFlight build
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[distribution-only]') }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Write ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Assign build to public external group and verify
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: ruby fastlane/testflight_distribution.rb
