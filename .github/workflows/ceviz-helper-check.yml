name: Ceviz Helper Checks

on:
  push:
    branches: ["**"]
    paths:
      - "backend/**"
      - "contracts/**"
      - "deploy/**"
      - "tests/*.py"
      - "push-worker/**"
      - "tests/js/**"
      - ".github/workflows/ceviz-helper-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "contracts/**"
      - "deploy/**"
      - "tests/*.py"
      - "push-worker/**"
      - "tests/js/**"
      - ".github/workflows/ceviz-helper-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_lifetime:
    name: Windows WSL lifetime boundaries
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated PowerShell lifecycle regressions
        # Real PowerShell processes with substituted task/WSL/firewall calls;
        # never install a task, start a distro or change a live firewall here.
        run: python -B -m unittest discover -s tests -p 'test_windows_lifecycle.py' -v

  helper:
    name: Helper contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate installer, Doctor and updater syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n deploy/install.sh
          bash -n deploy/doctor.sh
          python - <<'PY'
          from pathlib import Path
          path = Path("deploy/update.py")
          compile(path.read_bytes(), str(path), "exec")
          PY

      - name: Run complete Python contract and regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run notification relay boundary tests
        run: node --test tests/js/push-relay.test.mjs

      # These tests use isolated fixtures. They neither install a live service
      # nor prove a macOS updater: automatic service updates are Linux/WSL only.
      # Apple signing, TestFlight and production service changes are absent.
